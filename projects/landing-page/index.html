<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeBase</title>
  <style>
    /* ============================================================
       Reset & variables
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #f0f2f5;
      --surface:      #ffffff;
      --border:       #e2e5ea;
      --text:         #1a1a1a;
      --text-muted:   #6b7280;
      --accent:       #4f46e5;
      --accent-hover: #4338ca;
      --danger:       #dc2626;
      --shadow-sm:    0 1px 4px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 16px rgba(0,0,0,0.10);
      --radius:       12px;
      --radius-sm:    6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       Header
       ============================================================ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    /* ============================================================
       Main / grid
       ============================================================ */
    main {
      padding: 28px 24px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }

    /* ============================================================
       Tile
       ============================================================ */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      min-height: 110px;
      cursor: pointer;
      overflow: hidden;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .tile:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tile .favicon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tile .favicon-fallback {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .tile-name {
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: var(--text);
    }

    /* ============================================================
       Tile action buttons (Edit / Delete)
       ============================================================ */
    .tile-actions {
      position: absolute;
      top: 5px;
      right: 5px;
      display: flex;
      gap: 3px;
    }

    .tile-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }

    .tile-action-btn.edit   { color: var(--accent); }
    .tile-action-btn.edit:hover   { background: #ede9fe; border-color: var(--accent); }
    .tile-action-btn.delete { color: var(--danger); }
    .tile-action-btn.delete:hover { background: #fee2e2; border-color: var(--danger); }

    /* Desktop: show only on tile hover */
    @media (hover: hover) {
      .tile-actions { opacity: 0; pointer-events: none; }
      .tile:hover .tile-actions { opacity: 1; pointer-events: auto; }
    }

    /* Touch / no-hover: always visible but subtle */
    @media (hover: none) {
      .tile-actions { opacity: 0.55; }
    }

    /* ============================================================
       Empty state
       ============================================================ */
    .empty-state {
      color: var(--text-muted);
      text-align: center;
      margin-top: 60px;
      font-size: 1rem;
    }

    /* ============================================================
       Buttons
       ============================================================ */
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.12s;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.12s;
    }
    .btn-secondary:hover { background: var(--bg); }

    /* ============================================================
       Modal
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.hidden { display: none !important; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }

    .modal h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .field input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.12s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }

    .form-error {
      color: var(--danger);
      font-size: 0.83rem;
      margin-bottom: 8px;
    }

    .hidden { display: none !important; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    /* ============================================================
       Responsive
       ============================================================ */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      main   { padding: 16px; }

      .tile-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
      }

      .tile {
        padding: 18px 10px 14px;
        min-height: 95px;
      }

      .tile .favicon,
      .tile .favicon-fallback { width: 30px; height: 30px; }
    }

    @media (max-width: 360px) {
      .tile-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">HomeBase</span>
    <button id="add-tile-btn" class="btn-primary">+ Add Tile</button>
  </header>

  <main>
    <div id="tile-grid" class="tile-grid"></div>
    <p id="empty-state" class="empty-state hidden">
      No tiles yet. Click <strong>+ Add Tile</strong> to get started.
    </p>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title">Add Tile</h2>
      <form id="tile-form" novalidate>
        <div class="field">
          <label for="tile-name">Name</label>
          <input id="tile-name" type="text" placeholder="e.g. Google" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="tile-url">URL</label>
          <input id="tile-url" type="text" placeholder="https://google.com" autocomplete="off" required>
        </div>
        <p id="form-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ==========================================================================
    // ADMIN CONFIG — edit DEFAULT_TILES to change the default set of tiles.
    // Each tile needs a name (display label) and url (full URL with https://).
    // ==========================================================================
    const DEFAULT_TILES = [
      { name: "Google",       url: "https://www.google.com" },
      { name: "GitHub",       url: "https://github.com" },
      { name: "YouTube",      url: "https://www.youtube.com" },
      { name: "Reddit",       url: "https://www.reddit.com" },
      { name: "Hacker News",  url: "https://news.ycombinator.com" },
      { name: "Wikipedia",    url: "https://www.wikipedia.org" },
      { name: "Gmail",        url: "https://mail.google.com" },
      { name: "ChatGPT",      url: "https://chatgpt.com" },
    ];
    // ==========================================================================

    const STORAGE_KEY = 'homebase_tiles';
    let tiles = [];
    let editingIndex = null;

    // ── Storage ────────────────────────────────────────────────────────────────

    function loadTiles() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { tiles = JSON.parse(raw); return; } catch {}
      }
      tiles = DEFAULT_TILES.map(t => ({ ...t }));
    }

    function saveTiles() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tiles));
    }

    // ── Favicon helpers ────────────────────────────────────────────────────────

    function getDomain(url) {
      try { return new URL(url).hostname; } catch { return url; }
    }

    function faviconSrc(url) {
      return `https://www.google.com/s2/favicons?domain=${getDomain(url)}&sz=64`;
    }

    function initial(name) {
      return (name || '?').trim().charAt(0).toUpperCase();
    }

    // ── Rendering ──────────────────────────────────────────────────────────────

    function renderTiles() {
      const grid  = document.getElementById('tile-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (tiles.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tiles.forEach((tile, index) => {
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = tile.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const img = document.createElement('img');
        img.className = 'favicon';
        img.src = faviconSrc(tile.url);
        img.alt = '';
        img.loading = 'lazy';

        const fallback = document.createElement('div');
        fallback.className = 'favicon-fallback';
        fallback.textContent = initial(tile.name);
        fallback.style.display = 'none';

        img.addEventListener('error', () => {
          img.style.display = 'none';
          fallback.style.display = 'flex';
        });

        const nameEl = document.createElement('span');
        nameEl.className = 'tile-name';
        nameEl.textContent = tile.name;
        nameEl.title = tile.name;

        const actions = document.createElement('div');
        actions.className = 'tile-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'tile-action-btn edit';
        editBtn.title = 'Edit';
        editBtn.setAttribute('aria-label', `Edit ${tile.name}`);
        editBtn.textContent = '✎';
        editBtn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          openEditModal(index);
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'tile-action-btn delete';
        delBtn.title = 'Remove';
        delBtn.setAttribute('aria-label', `Remove ${tile.name}`);
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          removeTile(index);
        });

        actions.append(editBtn, delBtn);
        a.append(img, fallback, nameEl, actions);
        grid.appendChild(a);
      });
    }

    // ── CRUD ───────────────────────────────────────────────────────────────────

    function removeTile(index) {
      if (!confirm(`Remove "${tiles[index].name}"?`)) return;
      tiles.splice(index, 1);
      saveTiles();
      renderTiles();
    }

    function saveTileFromForm() {
      const name = document.getElementById('tile-name').value.trim();
      let   url  = document.getElementById('tile-url').value.trim();

      if (!name) { showError('Please enter a name.'); return false; }
      if (!url)  { showError('Please enter a URL.');  return false; }

      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      try { new URL(url); }
      catch { showError("That doesn't look like a valid URL."); return false; }

      if (editingIndex !== null) {
        tiles[editingIndex] = { name, url };
      } else {
        tiles.push({ name, url });
      }

      saveTiles();
      renderTiles();
      return true;
    }

    function showError(msg) {
      const el = document.getElementById('form-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // ── Modal ──────────────────────────────────────────────────────────────────

    function openAddModal() {
      editingIndex = null;
      document.getElementById('modal-title').textContent = 'Add Tile';
      document.getElementById('tile-name').value = '';
      document.getElementById('tile-url').value  = '';
      document.getElementById('form-error').classList.add('hidden');
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('tile-name').focus();
    }

    function openEditModal(index) {
      editingIndex = index;
      const t = tiles[index];
      document.getElementById('modal-title').textContent = 'Edit Tile';
      document.getElementById('tile-name').value = t.name;
      document.getElementById('tile-url').value  = t.url;
      document.getElementById('form-error').classList.add('hidden');
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('tile-name').focus();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      editingIndex = null;
    }

    // ── Event listeners ────────────────────────────────────────────────────────

    document.getElementById('add-tile-btn').addEventListener('click', openAddModal);

    document.getElementById('tile-form').addEventListener('submit', e => {
      e.preventDefault();
      if (saveTileFromForm()) closeModal();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeModal);

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ── Init ───────────────────────────────────────────────────────────────────

    loadTiles();
    renderTiles();
  </script>
</body>
</html>
